<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --sec:#6e6e73; --ter:#86868b;
  --sep:rgba(0,0,0,.08); --fill:rgba(0,0,0,.04); --hover:rgba(0,0,0,.025);
  --green:#248a3d; --green-t:rgba(52,199,89,.14); --green-s:#34c759;
  --amber:#a05a00; --amber-t:rgba(255,159,10,.16); --amber-s:#ff9f0a;
  --blue:#0066cc; --blue-t:rgba(0,113,227,.10); --blue-s:#0071e3;
  --gray:#6e6e73; --gray-t:rgba(142,142,147,.16); --gray-s:#c7c7cc;
  --red:#c9302c; --red-s:#ff3b30;
  --hi:#e34948; --lo:#2a78d6; --extra:#f5c400; --missing:#1baf7a; --edram:#b07ce8; --pre:#8e8e93;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1c1c1e; --text:#f5f5f7; --sec:#a1a1a6; --ter:#7c7c80;
  --sep:rgba(255,255,255,.10); --fill:rgba(255,255,255,.06); --hover:rgba(255,255,255,.035);
  --green:#30d158; --green-t:rgba(48,209,88,.16); --green-s:#30d158;
  --amber:#ffb340; --amber-t:rgba(255,159,10,.18); --amber-s:#ff9f0a;
  --blue:#409cff; --blue-t:rgba(10,132,255,.16); --blue-s:#0a84ff;
  --gray:#98989d; --gray-t:rgba(142,142,147,.2); --gray-s:#48484a;
  --red:#ff6961; --red-s:#ff453a;
  --hi:#e66767; --lo:#3987e5;
  --shadow:none;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:56px 22px 80px}
code,.mono{font-family:var(--mono);font-size:.86em;letter-spacing:0}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.eyebrow{font-size:13px;font-weight:600;color:var(--sec);letter-spacing:.02em;margin:0 0 6px}
h1{font:600 44px/1.08 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;letter-spacing:-.028em;margin:0}
.sub{color:var(--sec);font-size:17px;margin:12px 0 0;max-width:720px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg a,.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--sec);cursor:pointer;white-space:nowrap}
.seg .on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);text-decoration:none}
.seg a:hover{text-decoration:none;color:var(--text)}
.hero{margin:40px 0 18px;background:var(--card);border-radius:20px;padding:30px 32px 26px;box-shadow:var(--shadow)}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big .n{font:600 64px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big .t{font-size:21px;font-weight:600;letter-spacing:-.02em}
.big .t span{color:var(--sec);font-weight:400}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);margin:22px 0 16px;gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--sec);margin:0;padding:0;list-style:none}
.legend b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.c-proven{background:var(--green-s)} .c-likely{background:var(--blue-s)} .c-unknown{background:var(--amber-s)}
.c-na{background:var(--gray-s)} .c-identical{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gray-s)}
.hero .note{font-size:13px;color:var(--ter);margin:16px 0 0;max-width:820px}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--ter);margin:0 0 30px}
.meta b{color:var(--sec);font-weight:500}
.meta button{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;font-size:13px}
section{margin-top:44px}
section>h2{font:600 24px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:-.02em;margin:0 0 4px}
section>.gsub{color:var(--sec);font-size:13px;margin:0 0 14px;max-width:820px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.pad{padding:22px 24px}
/* Ranked table */
.rank{width:100%;border-collapse:collapse}
.rank th{font-size:12px;font-weight:500;color:var(--ter);text-align:left;padding:14px 14px 9px;border-bottom:1px solid var(--sep);white-space:nowrap}
.rank td{padding:14px;border-top:1px solid var(--sep);vertical-align:top;font-size:14px}
.rank tbody tr:first-child td{border-top:0}
.rank tbody tr{cursor:pointer}
.rank tbody tr:hover td{background:var(--hover)}
.rank tbody tr:focus-visible{outline:2px solid var(--blue-s);outline-offset:-2px}
.pass b{display:block;font-weight:600;letter-spacing:-.015em}
.pass small{display:block;color:var(--ter);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{display:flex;align-items:center;gap:8px}
.meter .track{width:64px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;flex:none}
.meter .track i{display:block;height:100%;background:var(--text);opacity:.8;border-radius:3px}
.meter span{font-weight:600}
.played{color:var(--sec)}
.what{color:var(--sec);font-size:13px;line-height:1.45;max-width:36ch}
.whys{display:grid;gap:7px;min-width:230px}
.why{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35}
.why .pc{color:var(--ter);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;margin-left:auto;padding-left:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;line-height:18px;height:20px;border-radius:10px;padding:0 8px;white-space:nowrap;flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-proven{color:var(--green);background:var(--green-t)} .b-likely{color:var(--blue);background:var(--blue-t)}
.b-unknown{color:var(--amber);background:var(--amber-t)} .b-na{color:var(--gray);background:var(--gray-t)}
.agree{font-size:12px;color:var(--ter);white-space:nowrap}
.agree.no{color:var(--amber);font-weight:600}
.agree small{display:block;font-weight:400;color:var(--ter);white-space:normal;margin-top:2px;max-width:18ch}
.next{font-size:12.5px;color:var(--sec);max-width:26ch;line-height:1.4}
.tail{padding:12px 16px;font-size:13px;color:var(--ter);border-top:1px solid var(--sep)}
.tail a{font-weight:500}
/* Frames */
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.frame h3{font-size:15px;font-weight:600;margin:0}
.frame .r{font-size:12px;color:var(--ter);margin:2px 0 12px}
.frame ul{list-style:none;margin:0;padding:0}
.frame li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--sep);font-size:14px}
.frame li:first-child{border-top:0}
.frame li a{color:var(--text);font-weight:500;min-width:0}
.frame li .c{color:var(--ter);font-size:12px;font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.frame li .w{font-size:12px;font-variant-numeric:tabular-nums;color:var(--sec);white-space:nowrap}
/* Tables */
.tbl{overflow-x:auto}
table.plain{border-collapse:collapse;width:100%;font-size:13px}
table.plain th{text-align:left;font-weight:500;color:var(--ter);font-size:12px;padding:0 12px 7px 0;white-space:nowrap}
table.plain td{border-top:1px solid var(--sep);padding:8px 12px 8px 0;vertical-align:top}
table.plain td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.unk{color:var(--ter)}
.warnchip{display:inline-block;font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-t);border-radius:5px;padding:0 6px;margin-left:4px}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--sep);font-size:12px;color:var(--ter);line-height:1.6}
footer p{margin:0 0 6px;max-width:900px}
/* Detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12px;background:var(--fill);border-radius:6px;padding:2px 8px;color:var(--sec)}
.chip.on{background:var(--text);color:var(--bg)}
a.chip:hover{text-decoration:none;color:var(--text)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:30px 0 0}
.stat{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .n{font:600 30px/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{color:var(--sec);font-size:13px;margin-top:5px}
.causes{display:grid;gap:0}
.cause{padding:18px 24px;border-top:1px solid var(--sep)}
.cause:first-child{border-top:0}
.cause .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cause .h b{font-size:16px;font-weight:600;letter-spacing:-.015em}
.cause .h .share{margin-left:auto;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--sec)}
.cause .h .share .track{width:90px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.cause .h .share .track i{display:block;height:100%;border-radius:3px}
.cause p{margin:8px 0 0;max-width:820px}
.cause .ev{color:var(--sec);font-size:13px}
.cause .ft{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--ter)}
.cause .ft b{color:var(--sec);font-weight:500}
.note{background:var(--blue-t);color:var(--text);border-radius:14px;padding:13px 16px;font-size:14px;margin-top:14px}
.note b{font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--fill);gap:2px;margin:14px 0 10px}
.split i{display:block;height:100%}
.hist{display:grid;gap:14px;margin-top:16px}
.hrow .lab{font-size:12px;color:var(--sec);margin-bottom:4px;display:flex;justify-content:space-between}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;align-items:end;height:64px;border-bottom:1px solid var(--sep)}
.bars i{display:block;border-radius:3px 3px 0 0;min-height:0;position:relative}
.bars i.neg{background:var(--lo)} .bars i.pos{background:var(--hi)}
.bars i:hover{opacity:.75}
.ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;font-size:10px;color:var(--ter);text-align:center;margin-top:3px;font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:7px;z-index:10;white-space:nowrap;opacity:0;transition:opacity .1s}
.viewer .tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--sep)}
.viewer .tools .sp{flex:1}
.stagebox{position:relative;line-height:0;cursor:crosshair;overflow:auto;max-height:78vh;background:repeating-conic-gradient(var(--fill) 0 25%,transparent 0 50%) 0 0/16px 16px}
.stagebox .layer{position:relative;display:inline-block}
.stagebox img{display:block;width:100%;height:auto;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
.stagebox img.top{position:absolute;inset:0}
.stagebox .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.stagebox .mark{position:absolute;width:13px;height:13px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.stagebox .tag{position:absolute;top:8px;font:600 11px/1 -apple-system,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:4px 7px;border-radius:6px;pointer-events:none}
.slider{width:160px}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--sec);padding:12px 20px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block}
.insp{padding:18px 22px}
.insp .empty{color:var(--ter);font-size:14px}
.loupes{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.loupe{width:132px}
.loupe div{width:132px;height:132px;border-radius:10px;background-repeat:no-repeat;image-rendering:pixelated;box-shadow:inset 0 0 0 1px var(--sep);position:relative}
.loupe div::after{content:"";position:absolute;left:60px;top:60px;width:12px;height:12px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.5)}
.loupe small{display:block;font-size:11px;color:var(--ter);margin-top:4px;text-align:center}
.words td{font-family:var(--mono);font-size:12px}
.words td:first-child{font-family:inherit;font-size:13px}
.words .d{color:var(--sec)}
.hi{color:var(--hi)} .lo{color:var(--lo)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){
  .wrap{padding:36px 16px 56px}
  h1{font-size:34px} .sub{font-size:15px}
  .hero{padding:24px 20px 22px;margin-top:28px;border-radius:18px}
  .big .n{font-size:52px} .big .t{font-size:18px}
  .rank thead{display:none}
  .rank,.rank tbody,.rank tr,.rank td{display:block;width:100%}
  .rank tr{padding:14px 16px;border-top:1px solid var(--sep)}
  .rank tbody tr:first-child{border-top:0}
  .rank td{border:0;padding:3px 0}
  .rank td.c-wrong,.rank td.c-played{display:inline-block;width:auto;margin-right:16px}
  .rank td.c-played::before{content:"as played ";color:var(--ter);font-size:12px}
  .what,.next{max-width:none}
  .whys{min-width:0}
  .grid2{grid-template-columns:1fr}
  .cause{padding:16px 18px}
  .cause .h .share{margin-left:0;width:100%}
  .pad{padding:18px}
  .viewer .tools{padding:14px 16px}
  .viewer .tools .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .viewer .tools .seg::-webkit-scrollbar{display:none}
  .viewer .tools .sp{display:none}
  .strip{grid-template-columns:1fr 1fr;gap:10px}
}

/* Command comparison workspace */
body{overflow-x:hidden}.wrap{max-width:none;padding:0;margin:0}
.workspace{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.stageside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--sep);background:var(--card)}
.sidehead{padding:22px 18px 16px;border-bottom:1px solid var(--sep)}.sidehead h1{font-size:19px;letter-spacing:-.035em;line-height:1.2;margin:7px 0 14px}.sidehead .eyebrow{font-size:10px;margin:0}
.sidehead label{font-size:12px;color:var(--sec);display:flex;align-items:center;gap:7px}.sidehead input{accent-color:var(--blue)}
.stagelist{overflow:auto;flex:1;padding:8px}.stageitem{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px;border-radius:8px;color:inherit;text-decoration:none;border:1px solid transparent;margin-bottom:4px}
.stageitem:hover{background:var(--fill)}.stageitem.on{background:var(--blue-t);border-color:var(--blue)}.stageitem img{width:64px;height:45px;object-fit:contain;background:#080909;border-radius:4px}.stageitem b{font-size:12px;display:block}.stageitem small{font-size:10px;color:var(--sec);display:block;margin-top:4px}.stageitem .rates{display:flex;gap:9px;font:10px var(--mono);margin-top:5px}.rates .wrong{color:var(--amber)}.rates .same{color:var(--green)}.sidefoot{padding:13px 18px;border-top:1px solid var(--sep);font-size:10px;color:var(--sec)}
.workmain{min-width:0;padding:25px 28px 60px}.workheader{display:flex;gap:15px;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.workheader h2{font-size:25px;letter-spacing:-.035em;margin:5px 0 6px}.workheader p{font-size:12px;color:var(--sec);margin:0}.workheader .eyebrow{font-size:10px}.commandnav{display:flex;gap:6px;flex-shrink:0}.commandnav button,.worktools button{padding:7px 11px;border:1px solid var(--sep);background:var(--card);border-radius:6px;color:var(--text);font-size:12px;cursor:pointer}.commandnav button:disabled{opacity:.3;cursor:default}
.worktools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--sec)}.worktools label{display:flex;gap:6px;align-items:center}.worktools input{accent-color:var(--blue)}.worktools .help{margin-left:auto;font-size:11px}.comparegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.comparecol{min-width:0;border:1px solid var(--sep);border-radius:10px;overflow:hidden;background:var(--card)}.colhead{min-height:62px;padding:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.colhead b{display:block;font-size:14px}.colhead small{display:block;font-size:11px;color:var(--sec);margin-top:5px}.colhead select{font-size:11px;border:1px solid var(--sep);background:var(--fill);color:var(--text);padding:4px;border-radius:4px;max-width:125px}.colhead .score{color:var(--amber)}.colhead .pass{color:var(--green)}
.syncview{aspect-ratio:var(--stage-ratio);overflow:auto;position:relative;background:#070909;cursor:crosshair;touch-action:none;overscroll-behavior:contain;scrollbar-width:thin}.syncview.dragging{cursor:grabbing}.imageplane{position:relative;transform-origin:0 0}.imageplane img{display:block;width:100%;max-width:none;height:auto;user-select:none;pointer-events:none}.cross{position:absolute;width:11px;height:11px;transform:translate(-50%,-50%);border:1px solid #fff;box-shadow:0 0 0 1px #000;pointer-events:none;border-radius:50%}.pendingcol{aspect-ratio:var(--stage-ratio);display:flex;align-items:center;justify-content:center;color:var(--sec);font-size:12px;background:var(--fill)}
.worklegend{display:flex;gap:15px;flex-wrap:wrap;font-size:10px;color:var(--sec);margin:10px 0 15px}.worklegend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}.pixelpanel{padding:14px 16px;border:1px solid var(--sep);border-radius:9px;background:var(--card);margin-top:14px;font-size:12px}.pixelpanel .plain td,.pixelpanel .plain th{padding:7px 10px}.pixelpanel p{margin:0;color:var(--sec)}.pixelpanel .tbl{margin-top:10px}.pixelpanel .words td{font-size:11px}.findings{margin-top:24px}.findings h3{font-size:17px;margin:0 0 12px}.evidencegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.evidencecard{padding:16px;border:1px solid var(--sep);border-radius:9px;background:var(--card)}.evidencecard h4{margin:0 0 8px;font-size:13px}.evidencecard p{font-size:12px;color:var(--sec);line-height:1.55;margin:5px 0 10px}.evidenceitem{border-top:1px solid var(--sep);padding-top:10px;margin-top:10px}.evidenceitem b{font-size:12px}.evidenceitem .badge{font-size:9px;margin-right:7px}.evidenceitem .nextstep{font-size:11px;color:var(--sec)}
.technical{margin-top:20px;border-top:1px solid var(--sep);padding-top:14px}.technical summary{font-size:12px;color:var(--sec);cursor:pointer}.technical section{margin-top:20px}.technical h2{font-size:18px}.technical .grid2{gap:12px}.technical .gsub{font-size:12px}.emptylist{font-size:12px;color:var(--sec);padding:16px}.worknote{font-size:11px;color:var(--sec);margin:10px 0}

</style></head><body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<script>
const D=/*__DATA__*/null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const P=(n,d,dig=0)=>{if(!d)return '0%';const v=100*n/d;if(dig===0&&v>0&&v<1)return '<1%';if(dig===0&&v>99&&v<100)return '>99%';return v.toFixed(dig)+'%'};
const PF=f=>P(f,1);
const CONF={proven:'Proven',likely:'Likely',unknown:'Unknown',na:'Not comparable'};
const STAGE={};D.stages.forEach(s=>STAGE[s.command]=s);
const MODE={isolated:'Isolated replay',played:'As played'};
const PRIMARY=D.primary;
const areaHref=a=>D.coverage?`${D.coverage}#${a.id}`:`${D.areas_dir}/${a.id}.json`;
const badge=c=>`<span class="badge b-${c}">${CONF[c]}</span>`;
function name(c){const s=STAGE[c];return s?s.name:String(c)}
function frameOf(c){return D.frames[STAGE[c].frame]}
function otherShare(s,label){const st=s.backends[label].stats;return st.other_differing==null?null:st.other_differing/st.pixels}
function topCause(s){const h=s.backends[PRIMARY].hypotheses;return h.length?h[0]:null}
function rowState(r){return r.state}
function rowConf(r){if(r.state==='identical')return 'identical';if(r.state==='na')return 'na';const h=topCause(STAGE[r.commands[0]]);return h?h.confidence:'unknown'}
function range(vals){const lo=Math.min(...vals),hi=Math.max(...vals);const a=PF(lo),b=PF(hi);return a===b?a:`${a}–${b}`}
function meter(f){return `<div class="meter"><div class="track"><i style="width:${Math.max(2,Math.round(f*100))}%"></i></div><span>${PF(f)}</span></div>`}

/* Tooltip */
const tip=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}
  tip.textContent=t.dataset.tip;tip.style.opacity=1;const w=tip.offsetWidth;
  tip.style.left=Math.min(innerWidth-w-8,e.clientX+12)+'px';tip.style.top=(e.clientY+14)+'px'});

/* Overview */
function overview(){
  const rows=D.rows, differ=rows.filter(r=>r.state==='differs');
  const nstages=D.stages.length, dstages=D.stages.filter(s=>s.backends[PRIMARY].stats.differing).length;
  const counts={proven:0,likely:0,unknown:0,na:0,identical:0};rows.forEach(r=>counts[rowConf(r)]++);
  const other=D.other_report?`<div class="seg">${['isolated','played'].map(m=>m===D.mode?`<a class="on">${MODE[m]}</a>`:`<a href="${esc(D.other_report)}">${MODE[m]}</a>`).join('')}</div>`:'';
  const iso=D.mode==='isolated';
  let h=`<div class="topbar"><div><p class="eyebrow">Console parity · ${MODE[D.mode]} · ${esc(PRIMARY)}</p>
  <h1>${esc(D.title)}</h1>
  <p class="sub">Where Xenia’s stages differ from the console’s, pass by pass: how much, why, how sure, and what to test next. ${iso?'Each pass was replayed with the console’s own output of every earlier pass in memory, so a row is that pass’s own difference, except through eDRAM, which isolation does not restore.':'Each pass was replayed from the trace as it is, so a difference may come from the passes before it; the isolated replay proves which.'}</p></div>${other}</div>
  <div class="hero"><div class="big"><span class="n">${differ.length}</span><span class="t">of ${rows.length} passes differ from the console <span>· ${dstages} of ${nstages} stages</span></span></div>
  <div class="bar">${['proven','likely','unknown','na','identical'].filter(k=>counts[k]).map(k=>`<i class="c-${k}" style="flex:${counts[k]}" data-tip="${counts[k]} ${k==='identical'?'identical':k==='na'?'not comparable':'led by a '+CONF[k].toLowerCase()+' cause'}"></i>`).join('')}</div>
  <ul class="legend">${[['proven','Led by a proven cause'],['likely','Led by a likely cause'],['unknown','Cause unknown'],['na','Not comparable'],['identical','Identical']].map(([k,t])=>`<li><span class="dot c-${k}"></span><b>${counts[k]}</b>${t}</li>`).join('')}</ul>
  <p class="note">A pass’s leading cause is the one covering most of its wrong pixels. Proven: a counterfactual replay puts the pixels right, or both sides kept an earlier pass’s eDRAM. Likely: the pattern and the pass’s registers match a console rule from the coverage map. Unknown: nothing tested explains it yet.</p></div>`;
  h+=`<div class="meta"><span><b>Trace</b> ${esc(D.suite)} · ${fmt(D.commands)} commands · ${D.frames.length} frames</span><span><b>Console</b> run ${esc(D.run)}, ${esc(D.console_date)}</span><span><b>Backends</b> ${D.backends.map(b=>esc(b.label)).join(', ')}${D.variants.length?' + '+D.variants.map(v=>esc(v.label)).join(', '):''}</span><span><button onclick="document.getElementById('prov').scrollIntoView({behavior:'smooth'})">Builds and cvars</button></span></div>`;
  h+=`<section><h2>Where Xenia goes wrong</h2><p class="gsub">${esc(PRIMARY)}, ranked by wrong pixels. A pass repeated in the next frame with the same outcome shares its row. Open a row for images, histograms, the pixel inspector and the pass’s draws.</p>
  <div class="card tbl"><table class="rank"><thead><tr><th>Pass</th><th>Wrong</th><th>${iso?'As played':'Isolated'}</th><th>What differs</th><th>Why · how sure</th><th>Backends</th><th>Test that would settle it</th></tr></thead><tbody>`;
  for(const r of rows.filter(r=>r.state!=='identical')){
    const s=STAGE[r.commands[0]], b=s.backends[PRIMARY];
    const others=r.commands.map(c=>otherShare(STAGE[c],PRIMARY)).filter(x=>x!=null);
    const hy=b.hypotheses.filter((x,i)=>!i||x.share>=0.005).slice(0,3);
    const nxt=(b.hypotheses.find(x=>x.confidence!=='proven'&&x.next)||b.hypotheses[0]||{}).next||'—';
    const ag=s.agree;
    h+=`<tr tabindex="0" data-go="#c${s.command}"><td class="pass"><b>${esc(r.name)}</b><small>${r.commands.map(c=>`${c} <span>${esc(frameOf(c).label)}</span>`).join(' · ')}</small></td>
    <td class="num c-wrong">${r.state==='na'?'<span class="unk">—</span>':meter(r.wrong.reduce((a,b)=>Math.max(a,b)))}${r.commands.length>1&&range(r.wrong).includes('–')?`<div class="agree">${range(r.wrong)}</div>`:''}</td>
    <td class="num played c-played">${others.length?range(others):'—'}</td>
    <td class="what" title="${esc(b.observation)}">${esc(b.brief||b.observation)}</td>
    <td><div class="whys">${hy.map(x=>`<div class="why">${badge(x.confidence)}<span>${esc(x.title)}</span><span class="pc">${PF(x.share)}</span></div>`).join('')}</div></td>
    <td>${ag.agree?`<span class="agree">All ${D.backends.length} agree</span>`:`<span class="agree no">Differ<small>${ag.differ.map(d=>esc(d.label+': '+d.text)).join('; ')} (vs ${esc(ag.primary)})</small></span>`}</td>
    <td class="next">${esc(nxt)}</td></tr>`;
  }
  const ident=rows.filter(r=>r.state==='identical');
  h+=`</tbody></table>${ident.length?`<div class="tail">Identical to the console: ${ident.map(r=>`<a href="#c${r.commands[0]}">${esc(r.name)}</a> (${r.commands.join(' · ')})`).join(', ')}.</div>`:''}</div></section>`;
  h+=`<section><h2>Passes by frame</h2><p class="gsub">Frames are bounded by recorded swap events, not GPU interrupts.</p><div class="frames">`;
  D.frames.forEach((f,k)=>{const ss=D.stages.filter(s=>s.frame===k);
    h+=`<div class="card pad frame"><h3>${esc(f.label)}</h3><div class="r">${esc(f.range)}</div><ul>${ss.map(s=>{const st=s.backends[PRIMARY].stats;return `<li><a href="#c${s.command}">${esc(s.name)}<span class="c">${s.command}</span></a><span class="w">${st.differing?PF(st.differing/st.pixels)+' wrong':'identical'}</span></li>`}).join('')}</ul></div>`});
  h+=`</div></section>`;
  h+=provenance();
  h+=footer();
  return h;
}
function provenance(){
  const rows=[...D.backends.map(b=>({...b,kind:'backend'})),...D.variants.map(v=>({...v,kind:'variant'}))];
  const u='<span class="unk">not recorded</span>';
  return `<section id="prov"><h2>Builds and cvars</h2><p class="gsub">What is known of each replay, from the xenia_provenance.json run.py writes with each replay (since gpugen-port 9a5cf511f) or recorded backend identity files.</p>
  <div class="card pad tbl"><table class="plain"><thead><tr><th>Replay</th><th>Verified build commit</th><th>Build tree</th><th>Trace dump</th><th>SHA-256</th><th>Cvars</th><th>GPU</th><th>Replayed</th></tr></thead><tbody>
  ${rows.map(r=>{const p=r.provenance;return `<tr><td>${esc(r.label)}${r.kind==='variant'?`<div class="unk">${esc(r.change)}</div>`:''}</td><td class="mono">${p.build_source?.commit?esc(p.build_source.commit.slice(0,12)):u}</td><td>${p.build_source?.dirty==null?u:p.build_source.dirty?'<span class="warnchip">dirty</span>':'clean'}</td><td class="mono">${p.binary?esc(p.binary.split('/').slice(-2).join('/')):u}</td><td class="mono">${p.sha256?esc(p.sha256.slice(0,12)):u}</td><td class="mono">${p.cvars?esc(p.cvars):u}</td><td>${p.gpu?esc(p.gpu):u}</td><td class="n">${esc(p.replayed||'')}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
}
function footer(){
  return `<footer><p>Steps are 1/255 of full scale for 8-bit channels, 1/1023 for 10-bit ones; depth differences are in units of 2⁻²⁴ (D24S8), floats in ULPs. Xenia high means Xenia’s numeric value is larger. Whether higher depth means nearer or farther depends on the depth convention.</p>
  <p>A pixel the console “left” holds the target’s earlier word: an earlier pass’s eDRAM, the pass’s background word, or, where no console word matches anything Xenia wrote, whatever the target held. Not comparable: Xenia’s replays from eDRAM all 00 and all FF disagree there, so it shows eDRAM from before the trace.</p>
  <p>Isolation (stage_isolate.py) puts each stage’s console output back in memory after its resolve; it restores memory, not eDRAM, so a pass drawing over an earlier pass’s eDRAM can still inherit its difference. Generated ${esc(D.generated)} by stage_report.py from run ${esc(D.run)}${D.coverage?` · causes link to the <a href="${esc(D.coverage)}">coverage map</a>`:''}.</p></footer>`;
}

/* Detail */
let current=null;
function detail(cmd){
  const s=STAGE[cmd]; if(!s) return overview();
  current={s,label:PRIMARY,view:'compare',pick:null};
  const f=frameOf(cmd), b=s.backends[PRIMARY], st=b.stats;
  const row=D.rows.find(r=>r.commands.includes(cmd));
  const os=otherShare(s,PRIMARY);
  let h=`<a class="back" href="#">‹ All passes</a><p class="eyebrow">${esc(f.label)} · command ${cmd} · ${MODE[D.mode]}</p><h1>${esc(s.name)}</h1>
  <p class="sub">${esc(s.derived.detail)} · resolved to ${esc(s.dest_base)} as ${esc(s.format)}${s.named&&s.derived.name!==s.name?` · ${esc(s.derived.name)}`:''}</p>
  ${row&&row.commands.length>1?`<div class="chips">${row.commands.map(c=>`<a class="chip ${c===cmd?'on':''}" href="#c${c}">${c} · ${esc(frameOf(c).label)}</a>`).join('')}</div>`:''}
  <div class="strip"><div class="stat"><div class="n">${st.differing?PF(st.differing/st.pixels):'0%'}</div><div class="l">pixels wrong · ${fmt(st.differing)} of ${fmt(st.pixels)}</div></div>
  <div class="stat"><div class="n">${os==null?'—':PF(os)}</div><div class="l">${D.mode==='isolated'?'as played':'isolated'} (${esc(PRIMARY)})</div></div>
  <div class="stat"><div class="n">${s.agree.agree?'Agree':'Differ'}</div><div class="l">${s.agree.agree?`all ${D.backends.length} backends tell the same story`:s.agree.differ.map(d=>esc(d.label+': '+d.text)).join('; ')}</div></div>
  <div class="stat"><div class="n">${s.draws}</div><div class="l">draws · ${s.hiz_tests} test hi-Z, ${s.his_tests} hi-S</div></div></div>`;
  if(s.prior) h+=`<div class="note"><b>Draws over ${esc(s.prior.name)} (${s.prior.command}) in eDRAM.</b> ${D.mode==='isolated'?'Isolation restores memory, not eDRAM, so':'In every replay'} ${esc(s.prior.name)}’s difference can reach this pass through the pixels it leaves.</div>`;
  h+=`<section><h2>Why</h2><p class="gsub">${esc(PRIMARY)}. Each cause with the share of the wrong pixels it accounts for; shares add up to 100%.</p><div class="card causes">${causes(b)}</div></section>`;
  h+=`<section><h2>What differs</h2><p class="gsub">${esc(b.observation)}</p><div class="grid2"><div class="card pad">${split(st)}</div><div class="card pad">${histogram(s,st)}</div></div></section>`;
  h+=`<section><h2>Pixels</h2><p class="gsub">Drag to compare the console with Xenia; click a pixel to inspect its words. The difference view marks Xenia high in red and low in blue, deeper for larger steps. ${esc(s.preview_note||'')}</p>
  <div class="card viewer"><div class="tools"><div class="seg" id="bk">${Object.keys(s.backends).map(l=>`<button data-b="${esc(l)}" class="${l===PRIMARY?'on':''}">${esc(l)}</button>`).join('')}</div>
  <div class="seg" id="vw">${[['compare','Compare'],['delta','Difference'],['console','Console'],['xenia','Xenia']].map(([k,t])=>`<button data-v="${k}" class="${k==='compare'?'on':''}">${t}</button>`).join('')}</div>
  <span class="sp"></span><div class="seg" id="zm"><button data-z="fit" class="on">Fit</button><button data-z="1">1×</button><button data-z="2">2×</button></div></div>
  <div class="stagebox" id="box"></div>
  <div class="keys">${[['--hi','Xenia high'],['--lo','Xenia low'],['--extra','Console left it, Xenia drew'],['--missing','Console drew, Xenia left it'],['--edram','Both kept an earlier pass’s eDRAM'],['--pre','eDRAM from before the trace']].map(([v,t])=>`<span><i style="background:var(${v})"></i>${t}</span>`).join('')}</div>
  <div class="insp" id="insp"><div class="empty">Click a pixel to see the console’s and every backend’s word there, decoded, with Xenia’s eDRAM-00 and -FF replays.</div></div></div></section>`;
  h+=`<section><h2>Backends</h2><p class="gsub">How each replay compares. “Same as ${esc(PRIMARY)}” counts identical words.</p><div class="card pad tbl">${backends(s)}</div></section>`;

const DATA={}, waiting={};
window.__stageData=async(cmd,obj)=>{

function showFirst(result){if(!stillCurrent())return;const el=$('#first-affected');if(el)el.innerHTML=result.first!==null?`First changed output${result.missing?' among available runs':''}: <a href="#c${result.first}">command ${result.first}</a>.`:`${result.missing?'No change in available paired outputs; some commands have missing run data.':'All recorded command outputs are byte-identical between these runs.'}`}
}catch(error){if(stillCurrent()){const el=$('#exact-run-delta');if(el)el.textContent='Exact run comparison unavailable: '+error.message;const first=$('#first-affected');if(first)first.textContent='First affected command has not been established.'}}}
